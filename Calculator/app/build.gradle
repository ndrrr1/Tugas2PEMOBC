plugins { id 'com.android.application' }
android {
    namespace 'com.guin.calculator'
    compileSdk 35
    defaultConfig {
        applicationId 'com.guin.calculator'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
